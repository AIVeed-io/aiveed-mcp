name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # leak-scan --history reads every commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/leak-scan.mjs
      - run: node scripts/leak-scan.mjs --history
      - run: node scripts/leak-scan.mjs --pack
      - name: Versions agree (package.json, server.json, src/server.ts)
        run: |
          v=$(node -p "require('./package.json').version")
          node -e "const s=require('./server.json'); if (s.version!=='$v' || s.packages[0].version!=='$v') { console.error('server.json version is not $v'); process.exit(1) }"
          grep -q "VERSION = '$v'" src/server.ts || { echo "src/server.ts VERSION is not $v"; exit 1; }
